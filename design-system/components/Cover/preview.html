<!-- @dsCard height=320 -->
<style>
  .cover{position:relative;width:960px;height:320px;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--font-sans)}
  .cover svg{position:absolute;inset:0;width:960px;height:320px}.mint{fill:var(--mint)}.brand{fill:var(--brand)}.deep{fill:var(--deep)}.paper{fill:var(--paper)}.sheet{rx:var(--radius-sheet)}.stage{rx:var(--radius-stage)}
  .cover h1{position:absolute;left:32px;bottom:72px;margin:0;font-size:64px;font-weight:650;letter-spacing:-3px;line-height:.95}.cover p{position:absolute;left:36px;bottom:36px;margin:0;font-size:14px;color:var(--muted)}
</style>
<div class="cover">
  <svg viewBox="0 0 960 320" aria-hidden="true">
    <!-- Color fields: mint 448×256, brand 160×192, deep 192×96, all token fills.
         Arrangement: one quiet page-sized sheet on the right, with two offset blocks.
         Motif: recording waveform cut from 16 rounded pillars, referencing on-device speech.
         Geometry: space-2, space-4, space-8; radius-sheet and radius-stage. -->
    <rect class="mint stage" x="480" y="32" width="448" height="256"></rect>
    <rect class="brand sheet" x="512" y="64" width="160" height="192"></rect>
    <rect class="deep sheet" x="704" y="64" width="192" height="96"></rect>
    <g class="paper">
      <rect x="528" y="145" width="4" height="30" rx="2"></rect><rect x="536" y="133" width="4" height="54" rx="2"></rect><rect x="544" y="121" width="4" height="78" rx="2"></rect><rect x="552" y="141" width="4" height="38" rx="2"></rect><rect x="560" y="137" width="4" height="46" rx="2"></rect><rect x="568" y="149" width="4" height="22" rx="2"></rect><rect x="576" y="129" width="4" height="62" rx="2"></rect><rect x="584" y="117" width="4" height="86" rx="2"></rect><rect x="592" y="137" width="4" height="46" rx="2"></rect><rect x="600" y="145" width="4" height="30" rx="2"></rect><rect x="608" y="125" width="4" height="70" rx="2"></rect><rect x="616" y="133" width="4" height="54" rx="2"></rect><rect x="624" y="141" width="4" height="38" rx="2"></rect><rect x="632" y="149" width="4" height="22" rx="2"></rect><rect x="640" y="137" width="4" height="46" rx="2"></rect><rect x="648" y="145" width="4" height="30" rx="2"></rect>
    </g>
    <rect class="paper sheet" x="704" y="192" width="192" height="64"></rect>
  </svg>
  <h1>OffTranscribe</h1><p>Your words. On your device.</p>
</div>
